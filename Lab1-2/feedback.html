<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Зворотній зв’язок</title>
    <link rel="stylesheet" href="styles/feedback.css" />
  </head>
  <body>
    <header>
      <nav>
        <a class = "back-button" href="index.html" role="button">До головної сторінки</a>
      </nav>
    </header>

    <main>
      <section aria-labelledby="feedback-title">
        <h1 id="feedback-title">Зворотній зв’язок</h1>

        <form action="index.html" method="get">
          <fieldset>
            <legend>Персональна інформація</legend>

            <div>
              <input type="text" id="fullname" name="fullname" placeholder=" " required />
              <label for="fullname">Прізвище та ім’я</label>
            </div>

            <div>
              <input type="email" id="email" name="email" placeholder=" " required />
              <label for="email">E-mail</label>
            </div>

            <div>
              <input
               placeholder=" "
                type="number"
                id="age"
                name="age"
                min="0"
                max="120"
                required
              />
              <label for="age">Вік</label>
            </div>

            <div>
              <select
                class="floating-select"
                id="education"
                name="education"
                required
                onclick="this.setAttribute('value', this.value);"
              >
                <option value=""></option>
                <option value="повна">Повна</option>
                <option value="неповна">Неповна</option>
                <option value="вища">Вища</option>
                <option value="професійна">Професійна</option>
              </select>
              <label class="education-label" for="education">Освіта</label>
            </div>
          </fieldset>

          <div>
            <select
              class="floating-select"
              id="purpose"
              name="purpose"
              onclick="this.setAttribute('value', this.value);"
              required
            >
              <option value=""></option>  
              <option value="співпраця">Співпраця</option>
              <option value="скарга">
                Скарга на порушення права власності
              </option>
              <option value="пропозиція">Пропозиція</option>
              <option value="помилка">Наявність помилки</option>
            </select>
            <label for="purpose">Мета зворотного зв’язку</label>
          </div>

          <div class="details-div">
            <label for="details">
              <span style="color: blue">Детально</span></label
            >
            <textarea
              id="details"
              name="details"
              rows="4"
              cols="50"
              maxlength="1000"
              required
            ></textarea>
          </div>

          <div class="checkbox-div">
            <input type="checkbox" id="consent" name="consent" required />
            <label for="consent"
              >Я даю згоду на обробку наданої інформації</label
            >
          </div>

          <div class="buttons">
            <button type="submit">Відправити</button>
            <button type="reset">Очистити</button>
          </div>
        </form>
      </section>
    </main>
    <script type = "module" src="dist/feedback.js"></script>
  </body>
</html>
